name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, tests et APK de débogage
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      # Le stockage Actions est limité : pas d'APK en artefact, et le reste n'est gardé que 3 jours.
      - name: Captures des tests d'écran
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures
          path: app/build/screens
          if-no-files-found: ignore
          retention-days: 3

      - name: Rapports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 3
